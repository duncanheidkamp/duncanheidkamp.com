<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubs Opening Day 2026</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Cubs brand colors */
    :root {
      --cubs-blue:  #0E3386;
      --cubs-red:   #CC3433;
      --ivy-green:  #4a6741;
      --brick:      #8b4513;
      --cream:      #f5f0e8;
      --white:      #ffffff;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: var(--cubs-blue);
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      /* Subtle texture: thin pinstripes like a Cubs road jersey */
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 28px,
        rgba(255,255,255,0.03) 28px,
        rgba(255,255,255,0.03) 29px
      );
    }

    /* ── Header / logo area ────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    /* Hand-drawn "C" using pure CSS — a thick ring with a gap */
    .cubs-c {
      width: 90px;
      height: 90px;
      border: 14px solid var(--cubs-red);
      border-radius: 50%;
      position: relative;
      margin: 0 auto 1rem;
      /* The gap on the right side */
      border-right-color: transparent;
      transform: rotate(15deg); /* tilt it like the actual C logo */
    }

    /* Inner blue ring */
    .cubs-c::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 5px solid var(--cubs-blue);
      border-right-color: transparent;
    }

    /* The two little horns/serifs on the C */
    .cubs-c::after {
      content: '';
      position: absolute;
      top: -4px;
      right: -6px;
      width: 16px;
      height: 6px;
      background: var(--cubs-red);
      border-radius: 3px;
      transform: rotate(-15deg);
    }

    .wordmark {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 2px 2px 0 var(--cubs-red);
    }

    .subtitle {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-top: 0.4rem;
    }

    /* ── Countdown grid ────────────────────────────────────────── */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.5rem, 2vw, 1.25rem);
      width: 100%;
      max-width: 520px;
    }

    .unit {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: clamp(0.75rem, 3vw, 1.25rem) 0.5rem;
      text-align: center;
      /* Slight inner shadow for depth */
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      transition: background 0.3s;
    }

    .unit:hover {
      background: rgba(255,255,255,0.11);
    }

    /* The big number */
    .unit .number {
      display: block;
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums; /* keeps width stable as digits change */
      color: var(--white);
      line-height: 1;
      /* Red underline accent */
      border-bottom: 3px solid var(--cubs-red);
      padding-bottom: 0.35rem;
      margin-bottom: 0.4rem;
    }

    /* Label under the number */
    .unit .label {
      display: block;
      font-size: clamp(0.6rem, 2vw, 0.75rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    /* ── Target date line ─────────────────────────────────────── */
    .target-date {
      margin-top: 2rem;
      font-size: clamp(0.75rem, 2.2vw, 0.9rem);
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
      text-align: center;
    }

    .target-date strong {
      color: rgba(255,255,255,0.8);
    }

    /* ── "Play Ball!" state (shown when countdown reaches zero) ── */
    .play-ball {
      display: none; /* hidden by default; JS shows it */
      text-align: center;
    }

    .play-ball h2 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--cubs-red);
      text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .play-ball p {
      margin-top: 0.75rem;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.12em;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.04); }
    }

    /* ── Footer ───────────────────────────────────────────────── */
    footer {
      position: fixed;
      bottom: 1rem;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
    }

    /* ── Ivy accent bar at bottom of card ─────────────────────── */
    .ivy-bar {
      width: 100%;
      max-width: 520px;
      height: 5px;
      background: linear-gradient(90deg, var(--ivy-green) 0%, #6a9b5f 50%, var(--ivy-green) 100%);
      border-radius: 0 0 4px 4px;
      margin-top: -1px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <div class="header">
    <div class="cubs-c" aria-hidden="true"></div>
    <div class="wordmark">Chicago Cubs</div>
    <div class="subtitle">Opening Day Countdown</div>
  </div>

  <!-- ── Countdown (shown before Opening Day) ───────────────────── -->
  <div class="countdown" id="countdown" role="timer" aria-live="polite" aria-label="Countdown to Opening Day 2026">
    <div class="unit">
      <span class="number" id="days">--</span>
      <span class="label">Days</span>
    </div>
    <div class="unit">
      <span class="number" id="hours">--</span>
      <span class="label">Hours</span>
    </div>
    <div class="unit">
      <span class="number" id="minutes">--</span>
      <span class="label">Minutes</span>
    </div>
    <div class="unit">
      <span class="number" id="seconds">--</span>
      <span class="label">Seconds</span>
    </div>
  </div>

  <!-- Thin ivy-colored bar under the countdown for a Wrigley nod -->
  <div class="ivy-bar"></div>

  <!-- Target date display -->
  <p class="target-date" id="target-display"></p>

  <!-- ── Play Ball state (shown after Opening Day) ──────────────── -->
  <div class="play-ball" id="play-ball">
    <h2>Play Ball!</h2>
    <p>Go Cubs Go!</p>
  </div>

  <footer>Let's Go Cubs &nbsp;·&nbsp; Wrigley Field</footer>

  <script>
    // ── Configuration ────────────────────────────────────────────
    // Opening Day 2026 for the Chicago Cubs.
    // NOTE: MLB hadn't published the full 2026 schedule at build time; this
    // date is an estimate. Update OPENING_DAY if the real date differs.
    //
    // Using 1:20 PM CT (18:20 UTC) — typical Cubs home-opener first pitch.
    const OPENING_DAY = new Date('2026-04-02T18:20:00Z'); // April 2, 2026 1:20 PM CT

    // ── DOM references ──────────────────────────────────────────
    const daysEl      = document.getElementById('days');
    const hoursEl     = document.getElementById('hours');
    const minutesEl   = document.getElementById('minutes');
    const secondsEl   = document.getElementById('seconds');
    const countdownEl = document.getElementById('countdown');
    const playBallEl  = document.getElementById('play-ball');
    const targetEl    = document.getElementById('target-display');
    const ivyBar      = document.querySelector('.ivy-bar');

    // ── Format the target date for display ──────────────────────
    const dateStr = OPENING_DAY.toLocaleDateString('en-US', {
      weekday: 'long',
      month:   'long',
      day:     'numeric',
      year:    'numeric',
      timeZone: 'America/Chicago',
    });
    const timeStr = OPENING_DAY.toLocaleTimeString('en-US', {
      hour:     'numeric',
      minute:   '2-digit',
      timeZoneName: 'short',
      timeZone: 'America/Chicago',
    });
    targetEl.innerHTML = `<strong>${dateStr}</strong> &nbsp;·&nbsp; ${timeStr}`;

    // ── Zero-pad a number to two digits ─────────────────────────
    function pad(n) {
      return String(n).padStart(2, '0');
    }

    // ── Main tick function — runs every second ──────────────────
    function tick() {
      const now  = Date.now();
      const diff = OPENING_DAY.getTime() - now; // milliseconds remaining

      if (diff <= 0) {
        // Opening Day has arrived (or passed)!
        countdownEl.style.display = 'none';
        ivyBar.style.display      = 'none';
        targetEl.style.display    = 'none';
        playBallEl.style.display  = 'block';
        return; // stop updating
      }

      // Break the remaining time into components
      const totalSeconds = Math.floor(diff / 1000);
      const seconds      = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes      = totalMinutes % 60;
      const totalHours   = Math.floor(totalMinutes / 60);
      const hours        = totalHours % 24;
      const days         = Math.floor(totalHours / 24);

      // Update the DOM — padded so the layout doesn't jump
      daysEl.textContent    = pad(days);
      hoursEl.textContent   = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    // ── Start the clock ─────────────────────────────────────────
    tick();                          // run immediately on load
    setInterval(tick, 1000);         // then every second
  </script>

</body>
</html>
